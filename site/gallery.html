<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · Eagles Apartment, Goma</title>
  <meta name="description" content="Photos of Eagles Apartment in Goma: rooftop lounge over Lake Kivu, living rooms, bedrooms, kitchens and the building.">
  <meta name="theme-color" content="#16323d">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="gallery">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <img src="images/rooftop-terrace.webp" alt="" class="page-hero__img">
      <div class="page-hero__shade"></div>
      <div class="container page-hero__content">
        <p class="eyebrow eyebrow--light">Eagles Apartment</p>
        <h1 data-i18n="nav.gallery">Gallery</h1>
        <p data-i18n="galPage.sub">Take a look around Eagles Apartment.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters" role="group">
          <button type="button" class="is-active" data-filter="all" data-i18n="gal.all">All</button>
          <button type="button" data-filter="rooftop" data-i18n="gal.rooftop">Rooftop</button>
          <button type="button" data-filter="living" data-i18n="gal.living">Living</button>
          <button type="button" data-filter="bedroom" data-i18n="gal.bedrooms">Bedrooms</button>
          <button type="button" data-filter="kitchen" data-i18n="gal.kitchen">Kitchen &amp; bath</button>
          <button type="button" data-filter="building" data-i18n="gal.building">Building</button>
        </div>
        <div class="gallery" id="gallery-grid" data-zoom-group></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
